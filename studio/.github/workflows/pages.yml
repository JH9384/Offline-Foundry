name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/hologram-forge-lane
            ~/.elan
          key: lane-${{ hashFiles('PRISMPM_REV', 'lean-toolchain') }}
      - name: The lane, which projects the page from the verified core and builds the wasm the page loads
        run: ./scripts/lane.sh
      - name: Byte identity corpus and shell hash check
        run: python3 tools/corpus.py
      - name: The site's included OpenRouter key, from the repository secret, never from the tree
        if: ${{ env.KEY != '' }}
        env:
          KEY: ${{ secrets.OPENROUTER_WARMUP_KEY }}
        run: python3 -c "import json,os;json.dump({'key':os.environ['KEY'],'model':'qwen/qwen3.8-flash'},open('shell/warmup.json','w'))"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Every shell script parses the way the browser parses it
        run: node tools/shell_parse.mjs
      - name: The vendored renderer, built beside the shell as the homepage (no Electron, no src/pro)
        run: cd vendor/dyad && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --ignore-scripts --engine-strict=false --force --no-audit --no-fund --loglevel=error && npx vite build --config vite.shell.config.mts --base /hologram-forge/ --outDir dist --emptyOutDir && python3 ../../scripts/stamp_shell.py
      - name: The host answers the renderer's own contracts (the renderer's node_modules are installed by now)
        run: node tools/contract_shapes.mjs --check
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: shell
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
